name: AEGIS Community Intelligence Validation

on:
  pull_request:
    paths:
      - 'pending/**'
      - 'global_whitelist.txt'
      - 'global_blacklist.txt'

  push:
    branches:
      - main
    paths:
      - 'pending/**'
      - 'global_whitelist.txt'
      - 'global_blacklist.txt'

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate community intelligence
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate feed syntax and safety rules
        run: |
          python .github/scripts/validate_community_feed.py

      - name: Show promotion policy
        run: |
          echo "=============================================="
          echo "AEGIS COMMUNITY INTELLIGENCE POLICY"
          echo "=============================================="
          echo "Community intelligence is advisory by default."
          echo "Community whitelist entries are NOT automatically trusted."
          echo "Community blacklist entries are NOT automatically blocked."
          echo "Production changes require review."
          echo "=============================================="
