name: AEGIS Community Staging Cleanup

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write

jobs:
  cleanup:
    name: Delete merged AEGIS staging branch

    if: >
      github.event.pull_request.merged == true &&
      startsWith(
        github.event.pull_request.head.ref,
        'aegis-community-staging'
      )

    runs-on: ubuntu-latest

    steps:
      - name: Delete merged staging branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}

        run: |
          echo "Deleting merged staging branch..."

          gh api \
            --method DELETE \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/git/refs/heads/$HEAD_REF"

          echo "Staging branch deleted."
