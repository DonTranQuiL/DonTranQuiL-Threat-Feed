name: AEGIS Community Security Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'pending/**'
      - 'global_whitelist.txt'
      - 'global_blacklist.txt'
      - '.github/scripts/validate_community_feed.py'
      - '.github/workflows/aegis-community-security-gate.yml'
  workflow_dispatch:

# This workflow intentionally runs on pull_request, not pull_request_target.
# PRs are treated as untrusted input. No repository secrets are exposed unless
# the repository owner explicitly enables the optional reputation lookups below.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: aegis-community-security-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: '1'
  AEGIS_MAX_NEW_ENTRIES: '500'
  AEGIS_MAX_TOTAL_FEED_LINES: '5000'
  AEGIS_VT_MIN_DETECTIONS: '2'

jobs:
  security-gate:
    name: Validate + reputation gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR merge revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate feed structure and changed entries
        env:
          AEGIS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          AEGIS_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python .github/scripts/validate_community_feed.py \
            --base-sha "$AEGIS_BASE_SHA" \
            --head-sha "$AEGIS_HEAD_SHA" \
            --report "$RUNNER_TEMP/aegis-validation.json"

      - name: Reputation check — VirusTotal hashes
        if: ${{ secrets.VIRUSTOTAL_API_KEY != '' }}
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          AEGIS_VT_MIN_DETECTIONS: ${{ env.AEGIS_VT_MIN_DETECTIONS }}
        run: |
          python .github/scripts/validate_community_feed.py \
            --reputation virustotal \
            --report "$RUNNER_TEMP/aegis-validation.json"

      - name: Reputation check — MalwareBazaar hashes
        if: ${{ secrets.MALWAREBAZAAR_AUTH_KEY != '' }}
        env:
          MALWAREBAZAAR_AUTH_KEY: ${{ secrets.MALWAREBAZAAR_AUTH_KEY }}
        run: |
          python .github/scripts/validate_community_feed.py \
            --reputation malwarebazaar \
            --report "$RUNNER_TEMP/aegis-validation.json"

      - name: Final security decision
        env:
          REPORT: ${{ runner.temp }}/aegis-validation.json
        run: |
          python .github/scripts/validate_community_feed.py \
            --finalize \
            --report "$REPORT"

      - name: Publish gate report
        if: always()
        env:
          REPORT: ${{ runner.temp }}/aegis-validation.json
        run: |
          if [ -f "$REPORT" ]; then
            python - <<'PY'
          import json, os
          p = os.environ['REPORT']
          data = json.load(open(p, encoding='utf-8'))
          print('### AEGIS Community Security Gate')
          print(f"- Decision: **{data.get('decision', 'UNKNOWN')}**")
          print(f"- Changed additions inspected: **{data.get('changed_additions', 0)}**")
          print(f"- Validation errors: **{len(data.get('errors', []))}**")
          print(f"- Warnings: **{len(data.get('warnings', []))}**")
          print(f"- Reputation checks: **{len(data.get('reputation', []))}**")
          for item in data.get('errors', [])[:20]:
              print(f"- ❌ {item}")
          for item in data.get('warnings', [])[:20]:
              print(f"- ⚠️ {item}")
          PY
          else
            echo 'No AEGIS report was produced.'
          fi

      - name: Upload machine-readable gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-community-security-gate-report
          path: ${{ runner.temp }}/aegis-validation.json
          if-no-files-found: ignore
