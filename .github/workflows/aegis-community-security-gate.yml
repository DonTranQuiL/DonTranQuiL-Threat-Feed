name: AEGIS Community Security Gate

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

    # No paths filter: this check is REQUIRED on main, so it must
    # report on every PR. PRs without feed changes need no API calls
    # and finish in seconds; non-feed changes by non-members fail.

  # PRs opened / updated with GITHUB_TOKEN (the promotion job's
  # fallback when the AEGIS App is not configured) do not trigger
  # pull_request_target, so the promotion job dispatches the gate for
  # its PR (visible, but not counted by the ruleset). The run checks
  # that PR's current head commit (must equal the dispatched commit;
  # same-repository head only).
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to gate (its head must be the dispatched branch)
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

# A newer push to the same PR cancels the old run (saves API quota).
concurrency:
  group: aegis-security-gate-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  security-gate:
    name: AEGIS Threat Feed Security Gate
    runs-on: ubuntu-latest

    # Sized for the worst case of a full lookup cap (120) on
    # every provider with an empty cache:
    #   CIRCL          120 x ~1 s          ~  2 min
    #   VirusTotal     120 x 16 s (4/min)  ~ 32 min
    #   MetaDefender   120 x ~1.5 s        ~  3 min (only if configured)
    #   MalwareBazaar  120 x ~1.5 s        ~  3 min
    #   setup / git                        ~  1 min
    # = ~41 min. VirusTotal only sees hashes CIRCL does not know
    # and cached answers are free, so real runs are shorter.
    timeout-minutes: 50

    # pull_request_target defaults to read-only cache. This job never
    # executes PR code (trusted main checkout; the PR is only read via
    # git), and the cache holds only API answers for validated hashes,
    # so it may save the reputation cache.
    cache-mode: write

    env:
      VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
      MALWAREBAZAAR_AUTH_KEY: ${{ secrets.MALWAREBAZAAR_AUTH_KEY }}

      # Optional: MetaDefender Cloud is used only if this secret exists.
      METADEFENDER_API_KEY: ${{ secrets.METADEFENDER_API_KEY }}

      # Free VirusTotal API: 4 lookups/minute, 500/day.
      AEGIS_VT_MIN_INTERVAL_SECONDS: '16'
      AEGIS_MB_MIN_INTERVAL_SECONDS: '1'
      AEGIS_CIRCL_MIN_INTERVAL_SECONDS: '0.5'
      AEGIS_MD_MIN_INTERVAL_SECONDS: '1'

      # Live lookups per provider per run: ~100 hashes fit in one run.
      AEGIS_MAX_REPUTATION_LOOKUPS: '120'

    steps:

      - name: Checkout trusted repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # One source of truth for the PR under test, for both triggers.
      # Base = main as checked out above (merge-base diffs are used).
      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_AUTHOR: ${{ github.event.pull_request.user.login }}
          EVENT_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          INPUT_PR: ${{ inputs.pr }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            number="$EVENT_PR"
            head_sha="$EVENT_HEAD_SHA"
            author="$EVENT_AUTHOR"
            association="$EVENT_ASSOCIATION"
          else
            case "$INPUT_PR" in
              ''|*[!0-9]*)
                echo "::error::input 'pr' must be a pull request number"
                exit 1
                ;;
            esac
            pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$INPUT_PR")"
            state="$(jq -r '.state' <<< "$pr_json")"
            head_repo="$(jq -r '.head.repo.full_name // ""' <<< "$pr_json")"
            head_sha="$(jq -r '.head.sha' <<< "$pr_json")"
            base_ref="$(jq -r '.base.ref' <<< "$pr_json")"
            author="$(jq -r '.user.login' <<< "$pr_json")"
            association="$(jq -r '.author_association' <<< "$pr_json")"
            if [ "$state" != "open" ] || [ "$head_repo" != "$GITHUB_REPOSITORY" ] || [ "$base_ref" != "$DEFAULT_BRANCH" ]; then
              echo "::error::PR #$INPUT_PR must be open, target $DEFAULT_BRANCH and come from this repository"
              exit 1
            fi
            if [ "$head_sha" != "$GITHUB_SHA" ]; then
              echo "::error::PR #$INPUT_PR head is $head_sha, but this run was dispatched for $GITHUB_SHA (branch moved on; a newer run checks it)"
              exit 1
            fi
            number="$INPUT_PR"
          fi

          {
            echo "number=$number"
            echo "head_sha=$head_sha"
            echo "base_sha=$(git rev-parse HEAD)"
            echo "author=$author"
            echo "association=$association"
          } >> "$GITHUB_OUTPUT"
          echo "Gating PR #$number at $head_sha (author $author, $association)"

      - name: Restore CIRCL reputation cache
        id: circl-cache
        uses: actions/cache/restore@v6
        with:
          path: .aegis-cache/reputation-circl.json
          key: aegis-reputation-circl-${{ github.run_id }}
          restore-keys: |
            aegis-reputation-circl-

      - name: Restore VirusTotal reputation cache
        id: vt-cache
        uses: actions/cache/restore@v6
        with:
          path: .aegis-cache/reputation-virustotal.json
          key: aegis-reputation-virustotal-${{ github.run_id }}
          restore-keys: |
            aegis-reputation-virustotal-

      - name: Restore MalwareBazaar reputation cache
        id: mb-cache
        uses: actions/cache/restore@v6
        with:
          path: .aegis-cache/reputation-malwarebazaar.json
          key: aegis-reputation-malwarebazaar-${{ github.run_id }}
          restore-keys: |
            aegis-reputation-malwarebazaar-

      - name: Restore MetaDefender reputation cache
        id: md-cache
        if: ${{ env.METADEFENDER_API_KEY != '' }}
        uses: actions/cache/restore@v6
        with:
          path: .aegis-cache/reputation-metadefender.json
          key: aegis-reputation-metadefender-${{ github.run_id }}
          restore-keys: |
            aegis-reputation-metadefender-

      - name: Fetch pull request commit
        env:
          PR_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -e

          echo "Fetching PR commit:"
          echo "$PR_SHA"

          # Full history so the merge base with main is known.
          # (persist-credentials is off: the repository is public
          # and this job never pushes.)
          git fetch --no-tags origin "$PR_SHA"

          echo "PR commit available for inspection."

      # author_association reports CONTRIBUTOR for private org members,
      # so look up the author's real permission. Any failure -> "none"
      # (fail closed: non-feed changes are then rejected).
      - name: Resolve PR author permission
        id: author
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ steps.pr.outputs.author }}
        run: |
          permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$PR_AUTHOR/permission" --jq .permission 2>/dev/null || true)"
          case "$permission" in
            admin|write|read) ;;
            *) permission=none ;;
          esac
          echo "PR author $PR_AUTHOR has repository permission: $permission"
          echo "permission=$permission" >> "$GITHUB_OUTPUT"

      - name: Validate community feed
        env:
          PR_BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_AUTHOR_ASSOCIATION: ${{ steps.pr.outputs.association }}
          PR_AUTHOR_PERMISSION: ${{ steps.author.outputs.permission }}
        run: |
          python .github/scripts/validate_community_feed.py \
            --base-sha "$PR_BASE_SHA" \
            --head-sha "$PR_HEAD_SHA" \
            --author-association "$PR_AUTHOR_ASSOCIATION" \
            --author-permission "$PR_AUTHOR_PERMISSION"

      # No key needed. A hash CIRCL knows (NSRL, Windows builds, ...)
      # is known-good and skips VirusTotal; CIRCL errors never count
      # as known-good (the hash then needs VirusTotal).
      - name: CIRCL hashlookup reputation check
        run: |
          python .github/scripts/validate_community_feed.py \
            --report "$RUNNER_TEMP/aegis-validation.json" \
            --reputation circl \
            --cache .aegis-cache/reputation-circl.json

      # Always runs: without a key the script skips with a warning,
      # but whitelist hashes CIRCL does not know then fail as unverified.
      - name: VirusTotal reputation check
        run: |
          python .github/scripts/validate_community_feed.py \
            --report "$RUNNER_TEMP/aegis-validation.json" \
            --reputation virustotal \
            --cache .aegis-cache/reputation-virustotal.json

      - name: VirusTotal not configured
        if: ${{ env.VIRUSTOTAL_API_KEY == '' }}
        run: |
          echo "::warning::VIRUSTOTAL_API_KEY is not configured."
          echo "VirusTotal reputation checking is skipped."

      # Optional: without METADEFENDER_API_KEY this is a silent no-op.
      # With a key it is fail closed like the others.
      - name: MetaDefender Cloud reputation check
        run: |
          python .github/scripts/validate_community_feed.py \
            --report "$RUNNER_TEMP/aegis-validation.json" \
            --reputation metadefender \
            --cache .aegis-cache/reputation-metadefender.json

      - name: MalwareBazaar reputation check
        run: |
          python .github/scripts/validate_community_feed.py \
            --report "$RUNNER_TEMP/aegis-validation.json" \
            --reputation malwarebazaar \
            --cache .aegis-cache/reputation-malwarebazaar.json

      - name: MalwareBazaar not configured
        if: ${{ env.MALWAREBAZAAR_AUTH_KEY == '' }}
        run: |
          echo "::warning::MALWAREBAZAAR_AUTH_KEY is not configured."
          echo "MalwareBazaar reputation checking is skipped."

      # Saved even when the gate fails, so a re-run reuses every
      # answer already paid for. Content-hash key: unchanged cache
      # is not saved again.
      - name: Save CIRCL reputation cache
        if: >-
          always() &&
          hashFiles('.aegis-cache/reputation-circl.json') != '' &&
          steps.circl-cache.outputs.cache-matched-key !=
          format('aegis-reputation-circl-{0}', hashFiles('.aegis-cache/reputation-circl.json'))
        uses: actions/cache/save@v6
        with:
          path: .aegis-cache/reputation-circl.json
          key: aegis-reputation-circl-${{ hashFiles('.aegis-cache/reputation-circl.json') }}

      - name: Save VirusTotal reputation cache
        if: >-
          always() &&
          hashFiles('.aegis-cache/reputation-virustotal.json') != '' &&
          steps.vt-cache.outputs.cache-matched-key !=
          format('aegis-reputation-virustotal-{0}', hashFiles('.aegis-cache/reputation-virustotal.json'))
        uses: actions/cache/save@v6
        with:
          path: .aegis-cache/reputation-virustotal.json
          key: aegis-reputation-virustotal-${{ hashFiles('.aegis-cache/reputation-virustotal.json') }}

      - name: Save MalwareBazaar reputation cache
        if: >-
          always() &&
          hashFiles('.aegis-cache/reputation-malwarebazaar.json') != '' &&
          steps.mb-cache.outputs.cache-matched-key !=
          format('aegis-reputation-malwarebazaar-{0}', hashFiles('.aegis-cache/reputation-malwarebazaar.json'))
        uses: actions/cache/save@v6
        with:
          path: .aegis-cache/reputation-malwarebazaar.json
          key: aegis-reputation-malwarebazaar-${{ hashFiles('.aegis-cache/reputation-malwarebazaar.json') }}

      - name: Save MetaDefender reputation cache
        if: >-
          always() &&
          hashFiles('.aegis-cache/reputation-metadefender.json') != '' &&
          steps.md-cache.outputs.cache-matched-key !=
          format('aegis-reputation-metadefender-{0}', hashFiles('.aegis-cache/reputation-metadefender.json'))
        uses: actions/cache/save@v6
        with:
          path: .aegis-cache/reputation-metadefender.json
          key: aegis-reputation-metadefender-${{ hashFiles('.aegis-cache/reputation-metadefender.json') }}

      - name: Final AEGIS security decision
        run: |
          python .github/scripts/validate_community_feed.py \
            --report "$RUNNER_TEMP/aegis-validation.json" \
            --finalize

      # The promotion job (staging PRs) judges each line from this
      # report; also handy for reviewing any run.
      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aegis-validation-report
          path: ${{ runner.temp }}/aegis-validation.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Security gate summary
        if: always()
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          echo "=============================================="
          echo "        AEGIS COMMUNITY SECURITY GATE"
          echo "=============================================="
          echo ""
          echo "PR: #$PR_NUMBER"
          echo "Repository: ${{ github.repository }}"
          echo ""
          echo "Remote intelligence is advisory."
          echo "Whitelist entries require human review."
          echo "Whitelist hashes must be known-good (CIRCL or"
          echo "VirusTotal) and unknown to MalwareBazaar."
          echo "Blacklist entries require validation."
          echo "No automatic merge is performed."
          echo ""
          echo "=============================================="

  # ------------------------------------------------------------------
  # Verified promotion (auto-split) for the staging inbox.
  #
  # A staging PR (branch aegis-community-staging*, pushed by the
  # Sentinel worker) is never merged. After its gate run, this job
  # takes ONLY the lines that passed every check, writes them onto a
  # fresh copy of main (branch aegis-verified-promotion, with proof
  # entries in verified_whitelist.json) and opens / updates the
  # "AEGIS verified promotion" PR. That PR is gated again (cached
  # answers) and merged by a human. Rejected lines are listed in a
  # comment on the staging PR.
  #
  # Token for the push + PR: the "AEGIS Promotion Bot" GitHub App when
  # the secrets AEGIS_APP_ID (App ID or Client ID) and
  # AEGIS_APP_PRIVATE_KEY exist. App pushes fire pull_request_target
  # (opened / synchronize) like a human push, so the REQUIRED gate
  # check is reported on the promotion PR. Without the App (or if
  # minting fails) the job falls back to GITHUB_TOKEN: its pushes do
  # not start pull_request_target, the gate is dispatched instead
  # (visible, but NOT counted by the ruleset) and the promotion PR
  # gets a comment asking for a close / reopen.
  #
  # Security: runs main's script on main's checkout; the staging PR is
  # only data (the gate report from the job above, built by the same
  # trusted script). No PR code is checked out or executed. No
  # credentials are stored in the checkout; the token is used only for
  # the push and the API calls. The main ruleset (PR + required gate,
  # no bypass) stops either token from touching main.
  # ------------------------------------------------------------------
  promote:
    name: AEGIS verified promotion
    needs: security-gate
    if: >-
      always() &&
      github.event_name == 'pull_request_target' &&
      (needs.security-gate.result == 'success' || needs.security-gate.result == 'failure') &&
      startsWith(github.event.pull_request.head.ref, 'aegis-community-staging') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # GITHUB_TOKEN (fallback path and staging comment).
    permissions:
      contents: write        # fallback: push the aegis-verified-promotion branch
      pull-requests: write   # fallback PR; comments on staging / promotion PR
      actions: write         # fallback: dispatch the security gate

    # One promotion at a time; never cancelled half-way.
    concurrency:
      group: aegis-verified-promotion
      cancel-in-progress: false

    env:
      PROMOTION_BRANCH: aegis-verified-promotion
      PROMOTION_TITLE: AEGIS verified promotion
      REOPEN_MARKER: '<!-- aegis-promotion-reopen -->'
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      STAGING_PR: ${{ github.event.pull_request.number }}
      STAGING_SHA: ${{ github.event.pull_request.head.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
      # 'true' / 'false' only; the secret values are never put in env.
      AEGIS_APP_CONFIGURED: ${{ secrets.AEGIS_APP_ID != '' && secrets.AEGIS_APP_PRIVATE_KEY != '' }}

    steps:

      # Installation token for THIS repository only, with only the
      # permissions the promotion needs. Failure (App not installed,
      # wrong key, ...) falls back to GITHUB_TOKEN with a warning.
      - name: Create GitHub App token
        id: app-token
        if: env.AEGIS_APP_CONFIGURED == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          # v3 also accepts this value as "client-id" (the newer name;
          # "app-id" still works but logs a deprecation notice).
          # actionlint 1.7.12 only knows "app-id" for v3, so it stays.
          app-id: ${{ secrets.AEGIS_APP_ID }}
          private-key: ${{ secrets.AEGIS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Choose promotion token
        id: auth
        env:
          APP_OUTCOME: ${{ steps.app-token.outcome }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          if [ "$APP_OUTCOME" = "success" ] && [ -n "$APP_SLUG" ]; then
            bot="${APP_SLUG}[bot]"
            bot_id="$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id 2>/dev/null || true)"
            case "$bot_id" in ''|*[!0-9]*) bot_id="" ;; esac
            email="${bot_id:+${bot_id}+}${bot}@users.noreply.github.com"
            echo "Promotion pushes and PR updates use the GitHub App ($bot)."
            {
              echo "mode=app"
              echo "name=$bot"
              echo "email=$email"
            } >> "$GITHUB_OUTPUT"
          else
            if [ "$AEGIS_APP_CONFIGURED" = "true" ]; then
              echo "::warning::AEGIS_APP_ID / AEGIS_APP_PRIVATE_KEY are set but no App token could be created (App installed on this repository? correct key?). Falling back to GITHUB_TOKEN."
            else
              echo "AEGIS_APP_ID / AEGIS_APP_PRIVATE_KEY not set: using GITHUB_TOKEN (promotion PR will need a close / reopen for the required gate check)."
            fi
            {
              echo "mode=github-token"
              echo "name=github-actions[bot]"
              echo "email=41898282+github-actions[bot]@users.noreply.github.com"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout trusted repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          # Public repository: fetches need no credentials. The push
          # step passes its token explicitly, so none is stored here
          # while the promotion script runs.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Download gate report
        uses: actions/download-artifact@v8
        with:
          name: aegis-validation-report
          path: ${{ runner.temp }}/aegis-gate

      - name: Find open promotion pull request
        id: existing
        run: |
          set -euo pipefail
          number="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&base=$BASE_BRANCH&head=${GITHUB_REPOSITORY_OWNER}:$PROMOTION_BRANCH" \
            --jq '.[0].number // empty')"
          carry=""
          if [ -n "$number" ] && git fetch --no-tags origin \
              "+refs/heads/$PROMOTION_BRANCH:refs/remotes/origin/$PROMOTION_BRANCH"; then
            carry="refs/remotes/origin/$PROMOTION_BRANCH"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "carry=$carry" >> "$GITHUB_OUTPUT"
          echo "Open promotion PR: ${number:-none}"

      - name: Build verified promotion
        id: build
        env:
          CARRY_REF: ${{ steps.existing.outputs.carry }}
        run: |
          set -euo pipefail
          python .github/scripts/validate_community_feed.py \
            --promote \
            --report "$RUNNER_TEMP/aegis-gate/aegis-validation.json" \
            --carry-ref "$CARRY_REF" \
            --plan "$RUNNER_TEMP/aegis-promotion-plan.json" \
            --comment "$RUNNER_TEMP/aegis-promotion-comment.md" \
            --pr-body "$RUNNER_TEMP/aegis-promotion-body.md" \
            --staging-pr "$STAGING_PR" \
            --staging-sha "$STAGING_SHA" \
            --run-url "$RUN_URL"
          if [ -n "$(git status --porcelain -- global_whitelist.txt global_blacklist.txt pending verified_whitelist.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push promotion branch
        id: push
        if: steps.build.outputs.changed == 'true'
        env:
          CARRY_REF: ${{ steps.existing.outputs.carry }}
          PUSH_TOKEN: ${{ steps.auth.outputs.mode == 'app' && steps.app-token.outputs.token || github.token }}
          COMMIT_NAME: ${{ steps.auth.outputs.name }}
          COMMIT_EMAIL: ${{ steps.auth.outputs.email }}
        run: |
          set -euo pipefail
          git config user.name "$COMMIT_NAME"
          git config user.email "$COMMIT_EMAIL"
          git switch -C "$PROMOTION_BRANCH"
          git add -A -- global_whitelist.txt global_blacklist.txt pending verified_whitelist.json
          git commit -q -m "AEGIS verified promotion from staging PR #$STAGING_PR" \
            -m "Staging commit $STAGING_SHA, gate run $RUN_URL"
          if [ -n "$CARRY_REF" ] && git diff --quiet "$CARRY_REF" HEAD; then
            echo "Promotion branch already has exactly this content."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Regenerated from main every time (lines still waiting were
          # carried over above), so a force push is intended here.
          basic="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          echo "::add-mask::$basic"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" \
            push --force origin "HEAD:refs/heads/$PROMOTION_BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update promotion pull request
        id: pr
        if: steps.push.outputs.pushed == 'true'
        env:
          EXISTING: ${{ steps.existing.outputs.number }}
          GH_TOKEN: ${{ steps.auth.outputs.mode == 'app' && steps.app-token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/aegis-promotion-body.md"
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$EXISTING" -F "body=@$body" > /dev/null
            number="$EXISTING"
          else
            number="$(gh api -X POST "repos/$GITHUB_REPOSITORY/pulls" \
              -f "title=$PROMOTION_TITLE" -f "head=$PROMOTION_BRANCH" -f "base=$BASE_BRANCH" \
              -F "body=@$body" --jq '.number')"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "Promotion PR: #$number"

      # Fallback only. GITHUB_TOKEN pushes do not start
      # pull_request_target; workflow_dispatch is the documented
      # exception, but the ruleset does not count that run. With the
      # App token the push itself starts the counted run, and a dispatch
      # would share its concurrency group
      # (aegis-security-gate-<PR>, cancel-in-progress) and could cancel
      # it, so it is skipped.
      - name: Run the security gate on the promotion pull request
        if: steps.pr.outputs.number != '' && steps.auth.outputs.mode != 'app'
        env:
          PROMOTION_PR: ${{ steps.pr.outputs.number }}
        run: |
          gh workflow run aegis-community-security-gate.yml --repo "$GITHUB_REPOSITORY" \
            --ref "$PROMOTION_BRANCH" -f pr="$PROMOTION_PR"

      # Fallback: GITHUB_TOKEN cannot close / reopen to trigger the
      # gate (that would be a GITHUB_TOKEN event too), so ask a human.
      # With the App, a stale notice from an earlier fallback is removed.
      - name: Close / reopen notice on the promotion pull request
        if: steps.pr.outputs.number != ''
        env:
          PROMOTION_PR: ${{ steps.pr.outputs.number }}
          MODE: ${{ steps.auth.outputs.mode }}
        run: |
          set -euo pipefail
          id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PROMOTION_PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith(env.REOPEN_MARKER))) | .id' | tail -n 1)"
          if [ "$MODE" = "app" ]; then
            if [ -n "$id" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$id"
              echo "Removed the old close / reopen notice (App token in use)."
            fi
            exit 0
          fi
          head="$(git rev-parse --short HEAD)"
          notice="$RUNNER_TEMP/aegis-reopen-notice.md"
          {
            echo "$REOPEN_MARKER"
            echo "**Action needed: close and reopen this PR** so the required check *AEGIS Threat Feed Security Gate* is reported for commit \`$head\`."
            echo ""
            echo "This update was pushed with \`GITHUB_TOKEN\`, which does not start \`pull_request_target\` runs. The gate run dispatched for it is visible under Actions but is not counted by the branch ruleset."
            echo "Configure the AEGIS Promotion Bot App (secrets \`AEGIS_APP_ID\`, \`AEGIS_APP_PRIVATE_KEY\`) to make this automatic."
          } > "$notice"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$notice" > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PROMOTION_PR/comments" -F "body=@$notice" > /dev/null
          fi
          echo "::warning::Promotion PR #$PROMOTION_PR needs a close / reopen for the required gate check (GITHUB_TOKEN fallback)."

      - name: Report on the staging pull request
        if: always() && steps.build.outcome == 'success'
        env:
          PROMOTION_PR: ${{ steps.pr.outputs.number || steps.existing.outputs.number }}
        run: |
          set -euo pipefail
          comment="$RUNNER_TEMP/aegis-promotion-comment.md"
          if [ -n "$PROMOTION_PR" ]; then
            printf '\nPromotion PR: #%s\n' "$PROMOTION_PR" >> "$comment"
          fi
          id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$STAGING_PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- aegis-promotion-report -->"))) | .id' | tail -n 1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$comment" > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$STAGING_PR/comments" -F "body=@$comment" > /dev/null
          fi
          echo "Promotion report posted on staging PR #$STAGING_PR."
